schema_version = 1

[server]
listen = "127.0.0.1:30000"
max_connections = 1024

[shutdown]
drain_timeout_ms = 30000

[logging]
format = "json"
filter = "info"

[router]
strategy = "round_robin"
max_concurrent_classifications = 4

[admission]
global = 64
generation_http = 64

[health]
interval_ms = 2000
timeout_ms = 1000
success_threshold = 1
failure_threshold = 3
max_concurrent_probes = 2

[http_generation]
trust_domain = "local"
buffered_request_max_bytes = 8388608
buffered_request_total_bytes = 268435456
streamed_request_max_bytes = 536870912
connect_timeout_ms = 5000
request_timeout_ms = 1800000
pool_idle_timeout_ms = 90000
pool_max_idle_per_host = 32

[[workers]]
worker_id = "omni-bf16-1"
base_url = "http://127.0.0.1:8011/"
trust_domain = "local"
default_model_id = "qwen3-omni"
health_path = "/health"

[workers.capacity]
generation_http = 32

[[workers.service_profiles]]
service = "generation_http"
model_ids = ["qwen3-omni"]
message_content_forms = ["string", "typed_parts"]
media_placements = ["top_level", "typed_parts"]
input_modalities = ["text", "image", "audio", "video"]
output_modalities = ["text", "audio"]
chat_audio_formats = ["wav", "mp3", "flac", "pcm", "aac", "opus"]
stream_modes = ["non_streaming", "streaming"]

[[workers]]
worker_id = "omni-bf16-2"
base_url = "http://127.0.0.1:8012/"
trust_domain = "local"
default_model_id = "qwen3-omni"
health_path = "/health"

[workers.capacity]
generation_http = 32

[[workers.service_profiles]]
service = "generation_http"
model_ids = ["qwen3-omni"]
message_content_forms = ["string", "typed_parts"]
media_placements = ["top_level", "typed_parts"]
input_modalities = ["text", "image", "audio", "video"]
output_modalities = ["text", "audio"]
chat_audio_formats = ["wav", "mp3", "flac", "pcm", "aac", "opus"]
stream_modes = ["non_streaming", "streaming"]
