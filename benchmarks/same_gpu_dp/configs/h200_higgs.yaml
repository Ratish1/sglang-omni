# H200 Higgs same-GPU DP study. Adapt CPU IDs to the selected GPU's NUMA node.
version: 1

common:
  gpu_uuid: ${GPU_UUID}
  numa_node: 0
  model: bosonai/higgs-tts-3-4b
  model_name: higgs
  meta: zhaochenyang20/seed-tts-eval-arrow
  bench_lang: en
  ref_format: references
  allowed_local_media_path: /
  max_running_requests: 64
  cuda_graph_max_bs: 64
  max_new_tokens: 2048
  max_samples: 300
  warmup: 1
  seed: 1
  kv_equality: require
  require_idle_gpu: true
  mps_ready_timeout: 30

calibration:
  dps: [2, 3, 4]
  repetitions: 2

matrix:
  order: ["1:0", "1:1", "2:0", "2:1", "3:0", "3:1", "4:0", "4:1"]
  concurrency_values: [32, 48, 64, 96]
  repetitions: 5
  shuffle_seed: 986

layouts:
  1:
    server_core_sets: [0-31]
    client_core_sets: [64-79]
    mem_fractions: [0.85]
  2:
    server_core_sets: [0-15, 16-31]
    client_core_sets: [64-71, 72-79]
    mem_fractions: [0.42, 0.42]
  3:
    server_core_sets: [0-9, 10-19, 20-31]
    client_core_sets: [64-68, 69-73, 74-79]
    mem_fractions: [0.27, 0.27, 0.27]
  4:
    server_core_sets: [0-7, 8-15, 16-23, 24-31]
    client_core_sets: [64-67, 68-71, 72-75, 76-79]
    mem_fractions: [0.21, 0.21, 0.21, 0.21]
