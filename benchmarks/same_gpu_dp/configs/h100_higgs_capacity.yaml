# H100 80GB capacity-only calibration. No benchmark traffic is generated.
version: 1

common:
  gpu_uuid: ${GPU_UUID}
  numa_node: 0
  model: bosonai/higgs-tts-3-4b
  model_name: higgs
  client_driver: seedtts
  max_running_requests: 64
  cuda_graph_max_bs: 64
  max_new_tokens: 2048
  kv_equality: warn
  require_idle_gpu: true
  mps_ready_timeout: 30

calibration:
  dps: [2, 3]
  mps_modes: [1]
  confirmations: 3
  token_tolerance: 256
  growth_factor: 2
  max_search_trials: 20
  margin_basis_points: 0

layouts:
  2:
    server_core_sets: [0-15, 16-31]
    client_core_sets: [64-71, 72-79]
    mem_fractions: [auto, auto]
    initial_cap_tokens: 78015
  3:
    server_core_sets: [0-9, 10-19, 20-31]
    client_core_sets: [64-68, 69-73, 74-79]
    mem_fractions: [auto, auto, auto]
    initial_cap_tokens: 20969
