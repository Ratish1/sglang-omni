# SPDX-License-Identifier: Apache-2.0
#
# Example single-H200 colocated Qwen3-Omni FP8 launcher config.
# The Python pipeline config owns the stage topology; this file sets the model
# path and H200 runtime memory budgets used for one-GPU colocated launch.
#
# This profile follows the H200 colocated budget shape: about 6% of device
# memory stays outside stage budgets for CUDA graph capture, backend
# workspaces, activation peaks, and allocator fragmentation.

config_cls: Qwen3OmniSpeechColocatedPipelineConfig
name: qwen3-omni-fp8-colocated-h200
model_path: marksverdhei/Qwen3-Omni-30B-A3B-FP8
relay_backend: shm

stage_overrides:
  image_encoder:
    runtime:
      resources:
        total_gpu_memory_fraction: 0.017

  audio_encoder:
    runtime:
      resources:
        total_gpu_memory_fraction: 0.017

  thinker:
    runtime:
      resources:
        total_gpu_memory_fraction: 0.769

  talker_ar:
    runtime:
      resources:
        total_gpu_memory_fraction: 0.123

  code2wav:
    runtime:
      resources:
        total_gpu_memory_fraction: 0.014
