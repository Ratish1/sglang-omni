# FP8 colocated H100 video profile for Phase 2 payload-locality experiments.
#
# This keeps the 32k video-context profile unchanged, but runs mm_aggregate in
# the same OS process as thinker. The expected effect is that the large
# mm_aggregate -> thinker visual embedding/deepstack handoff uses local_object
# dispatch instead of relaying ~1.8 GiB through shm for 8 Video-MME requests.

config_cls: Qwen3OmniSpeechColocatedPipelineConfig
name: qwen3-omni-colocated-h100-fp8-video-locality
model_path: marksverdhei/Qwen3-Omni-30B-A3B-FP8
relay_backend: shm
fused_stages:
  - [mm_aggregate, thinker]

stage_overrides:
  preprocessing:
    runtime:
      max_seq_len: 32768

  image_encoder:
    runtime:
      resources:
        total_gpu_memory_fraction: 0.025

  audio_encoder:
    runtime:
      resources:
        total_gpu_memory_fraction: 0.025

  thinker:
    runtime:
      max_seq_len: 32768
      resources:
        total_gpu_memory_fraction: 0.55  # Qwen3-Omni subtracts default encoder_mem_reserve=0.05, so effective SGLang/KV budget is 0.50.

  talker_ar:
    runtime:
      resources:
        total_gpu_memory_fraction: 0.12

  code2wav:
    runtime:
      resources:
        total_gpu_memory_fraction: 0.02
